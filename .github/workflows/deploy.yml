name: Deploy to Cloudflare

# 在仓库 Settings → Secrets 添加 CLOUDFLARE_API_TOKEN 与 CLOUDFLARE_ACCOUNT_ID 之前，此工作流会自动跳过。
# 还需在 Settings → Variables 添加：
#   D1_DATABASE_ID   `wrangler d1 create blog` 输出的 ID
#   BLOG_ORIGIN      博客地址，例如 https://blog.example.com（用于预渲染与 ALLOWED_ORIGINS）
#   PAGES_PROJECT    Pages 项目名，例如 winston-blog
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB: ${{ vars.D1_DATABASE_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ] && [ -n "$DB" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / D1_DATABASE_ID，跳过部署。"
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test
      - name: Fill in D1 database id and allowed origin
        working-directory: worker
        env:
          DB: ${{ vars.D1_DATABASE_ID }}
          ORIGIN: ${{ vars.BLOG_ORIGIN }}
        run: |
          sed -i "s/00000000-0000-0000-0000-000000000000/${DB}/" wrangler.jsonc
          if [ -n "$ORIGIN" ]; then sed -i "s|\"ALLOWED_ORIGINS\": \"[^\"]*\"|\"ALLOWED_ORIGINS\": \"${ORIGIN}\"|" wrangler.jsonc; fi
      - name: D1 migrations
        working-directory: worker
        run: npx wrangler d1 migrations apply blog --remote
      - name: Deploy Worker
        working-directory: worker
        run: npx wrangler deploy
      - name: Build frontend (prerender from production API)
        env:
          BLOG_API_URL: ${{ vars.BLOG_ORIGIN }}
          BLOG_SITE_URL: ${{ vars.BLOG_ORIGIN }}
        run: npm run build
      - name: Deploy Pages
        run: npx wrangler pages deploy web/dist --project-name "${{ vars.PAGES_PROJECT || 'winston-blog' }}" --branch main
